<!DOCTYPE html>

<html>
    
    <head>
    <meta charset="UTF-8">
    <title>Catalog Page</title>
    </head>

    <body>
    <h1>Catalog Page</h1>
    <a href="{% url 'home' %}">Home</a>

    {% for product in all_products %}
        <div class="product-card">
            <h3>{{ product.name }}</h3>
            <p>Price: {{ product.price }}</p>
        </div>
    {% endfor %}

    </body>

</html>
